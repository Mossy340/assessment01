<html lang="en">
	<head>
		<!-- Meta tags -->
		<meta charset="UTF-8">

		<!-- Tab info -->
		<title>Apex Auto Care</title>

		<!-- Link to css -->
		<link rel="stylesheet" href="css/styles.css">
	</head>

	<body>
		<!-- Navigation bar internal and external links -->
		<nav>
			<a href="index.html">Home</a>
			<a href="about.html">About</a>
			<a href="contact.html">Contact</a>
			<a href="services.html">Services</a>
			<a href="https://www.instagram.com">Visit our Instagram page</a>
		</nav>

		<!-- Main page heading -->
		<h1>Apex Auto Care</h1>
		<h2>"Keeping you moving, mile after mile."</h2>

		<!-- Contact details -->
		<h3>Address</h3>
		<p> 25 Marshmellow Street<br>Dublin 6<br>Ireland</p>

		<h3>Phone</h3>
		<p>(01) 123 4567</p>

		<h3>Email</h3>
		<p>info@apexautocare.ie</p>

		<!-- Contact form -->
		<h2>Contact us</h2>
		<form action="#" method="post">
			<p>
				<label for="name">Name</label><br>
				<input type="text" id="name" name="name" required>
			</p>
			<p>
				<label for="email">Email</label><br>
				<input type="email" id="email" name="email" required>
			</p>
			<p>
				<label for="phone">Phone</label><br>
				<input type="tel" id="phone" name="phone">
			</p>
			<p>
				<label for="reason">Reason for contact</label><br>
				<select id="reason" name="reason">
					<option value="">Please choose...</option>
					<option value="booking">Book a service</option>
					<option value="quote">Request a quote</option>
					<option value="general">General enquiry</option>
				</select>
			</p>
			<p>
				<label for="message">Message</label><br>
				<textarea id="message" name="message" rows="4" required></textarea>
			</p>
			<p>
				<button type="submit">Submit</button>
			</p>
		</form>

	</body>
